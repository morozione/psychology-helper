name: Distribute to Firebase App Distribution

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers (leave blank to use the latest VERSIONS.md entry)'
        required: false
        default: ''

# Required repository secrets:
#   FIREBASE_APP_ID          - Android App ID from Firebase console
#                              (Project Settings → Your apps → App ID)
#                              Format: 1:123456789012:android:abc123def456
#
#   CREDENTIAL_FILE_CONTENT  - Firebase service account JSON (paste raw JSON content)
#                              Create via: Google Cloud Console → IAM → Service Accounts
#                              Role: Firebase App Distribution Admin → download JSON key
#
#   GOOGLE_SERVICES_JSON     - google-services.json content (paste raw JSON content)
#                              Download from: Firebase console → Project Settings → Your apps
#
#   GEMINI_API_KEY           - Gemini API key used by the in-app chat assistant (Android only)
#                              Create via: https://aistudio.google.com/apikey
#
# Optional:
#   FIREBASE_TESTER_GROUPS   - Comma-separated tester group aliases (e.g. "qa-team,beta-testers")

jobs:
  distribute:
    name: Build & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is empty. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json
          if ! python3 -m json.tool composeApp/google-services.json > /dev/null 2>&1; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not valid JSON. Open the google-services.json file downloaded from Firebase Console (Project Settings -> Your apps), select all its text, and paste it as the secret value exactly -- no surrounding quotes, no extra escaping."
            exit 1
          fi

      - name: Read version info from VERSIONS.md
        id: version
        run: |
          PARSED=$(awk -v RS='' -v FS='\n' '
            $1 ~ /^[0-9]+[ \t]/ {
              count++
              if (!found) { found=1; header=$1; desc=$2 }
            }
            END { print header; print desc; print count+0 }
          ' VERSIONS.md)
          HEADER=$(echo "$PARSED" | sed -n '1p')
          DESC=$(echo "$PARSED" | sed -n '2p')
          TOTAL=$(echo "$PARSED" | sed -n '3p')
          if [ -z "$HEADER" ]; then
            echo "::error::Could not find a '<code> <title>' entry in VERSIONS.md."
            exit 1
          fi
          CODE=$(echo "$HEADER" | awk '{print $1}')
          NAME=$(echo "$HEADER" | cut -d' ' -f2-)
          if [ "$CODE" != "$TOTAL" ]; then
            echo "::error::VERSIONS.md top entry code ($CODE) does not match the total number of entries ($TOTAL) — bump it when adding a new version."
            exit 1
          fi
          {
            echo "notes<<VERSIONS_EOF"
            echo "v$NAME: $DESC"
            echo "VERSIONS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :composeApp:assembleRelease --stacktrace -PGEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || steps.version.outputs.notes }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" > /tmp/credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/credentials.json
          GROUPS_FLAG=""
          if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
            GROUPS_FLAG="--groups $FIREBASE_TESTER_GROUPS"
          fi
          firebase appdistribution:distribute \
            composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            $GROUPS_FLAG
