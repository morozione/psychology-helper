name: Distribute to Firebase App Distribution

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'New build from main branch'

# Required repository secrets:
#   FIREBASE_APP_ID          - Android App ID from Firebase console
#                              (Project Settings → Your apps → App ID)
#                              Format: 1:123456789012:android:abc123def456
#
#   CREDENTIAL_FILE_CONTENT  - Firebase service account JSON (paste raw JSON content)
#                              Create via: Google Cloud Console → IAM → Service Accounts
#                              Role: Firebase App Distribution Admin → download JSON key
#
#   GOOGLE_SERVICES_JSON     - google-services.json content (paste raw JSON content)
#                              Download from: Firebase console → Project Settings → Your apps
#
#   GEMINI_API_KEY           - Gemini API key used by the in-app chat assistant (Android only)
#                              Create via: https://aistudio.google.com/apikey
#
# Optional:
#   FIREBASE_TESTER_GROUPS   - Comma-separated tester group aliases (e.g. "qa-team,beta-testers")

jobs:
  distribute:
    name: Build & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :composeApp:assembleRelease --stacktrace -PGEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || format('Build from commit {0}', github.sha) }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" > /tmp/credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/credentials.json
          GROUPS_FLAG=""
          if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
            GROUPS_FLAG="--groups $FIREBASE_TESTER_GROUPS"
          fi
          firebase appdistribution:distribute \
            composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            $GROUPS_FLAG
